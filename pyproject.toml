[project]
name = "paraglacial-hazard-utac"
version = "1.0.1"
description = "Paraglacial and geophysical hazard science -- GIA/seismicity context (Grosset et al. 2023), permafrost-driven rock-slope instability (Fey et al. 2025, Gruber & Haeberli 2007), and GLOF exposure (Taylor et al. 2023, Lutzow et al. 2023) -- companion to glacial-seismicity-utac (P101), no UTAC/CREP bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/GenesisAeon/paraglacial-hazard-utac"
Repository = "https://github.com/GenesisAeon/paraglacial-hazard-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paraglacial_hazard_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=paraglacial_hazard_utac --cov-report=term-missing -v"
